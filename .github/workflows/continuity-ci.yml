name: SimLay Continuity CI

on:
  push:
    branches:
      - main
      - 'continuity/**'
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: pip install -r requirements.txt pytest
      - name: Test backend
        run: pytest -q

  falsetech-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/falsetech-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install node test dependencies
        run: pip install -r requirements.txt pytest
      - name: Test naming, safe rename, and offline queue
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Build frontend
        run: npm run build
