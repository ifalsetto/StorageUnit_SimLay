name: SimLay Continuity CI

on:
  push:
    branches:
      - main
      - 'continuity/**'
  pull_request:
    branches:
      - main

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical lineage and execution gate
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          grep -Fq 'ifalsetto/StorageUnit_SimLay' AGENTS.md
          grep -Fq 'CONTINUITY_CHECK_WINDOWS.ps1 -RequireCanonical' AGENTS.md
          test -f CONTINUITY_CHECK_WINDOWS.ps1
          test -f READY_SIMLAY_WINDOWS.ps1
          test -f backend/config/market_intelligence.yaml
          if [ -f FALSETECH_REPOSITORY_ROLE.md ] && grep -Fiq 'NOT THE SIMLAY CORE' FALSETECH_REPOSITORY_ROLE.md; then
            echo 'Canonical repo is incorrectly marked as non-core.' >&2
            exit 1
          fi

  backend:
    needs: continuity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: pip install -r requirements.txt pytest
      - name: Validate config
        run: python scripts/validate_config.py
      - name: Test backend
        run: pytest -q

  falsetech-node:
    needs: continuity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/falsetech-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install node test dependencies
        run: pip install -r requirements.txt pytest
      - name: Test naming, safe rename, offline queue, and storage safety
        run: pytest -q

  frontend:
    needs: continuity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Build frontend
        run: npm run build
